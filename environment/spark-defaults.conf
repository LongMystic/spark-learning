# Defaults baked into the local docker standalone cluster.
# The History Server (:18080) replays any app that wrote event logs here.
spark.eventLog.enabled            true
spark.eventLog.dir                file:///opt/spark-events
spark.history.fs.logDirectory     file:///opt/spark-events

# Modest, observable defaults that mirror a small cluster.
spark.sql.adaptive.enabled        true
spark.sql.shuffle.partitions      8
spark.master                      spark://spark-master:7077
