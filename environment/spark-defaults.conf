# Reference Spark defaults for the local minikube cluster.
# To use these, either bake them into a custom Spark image at
#   /opt/spark/conf/spark-defaults.conf
# or create a ConfigMap and mount it into driver/executor pods.
# Currently the K8s manifests pass equivalent settings via SPARK_HISTORY_OPTS
# and sparkConf directly — this file serves as the canonical reference.
# The History Server (:18080) replays any app that wrote event logs here.
spark.eventLog.enabled            true
spark.eventLog.dir                s3a://spark-events/
spark.history.fs.logDirectory     s3a://spark-events/

# Modest, observable defaults that mirror a small cluster.
spark.sql.adaptive.enabled        true
spark.sql.shuffle.partitions      8

# --- Kubernetes as the cluster manager -------------------------------------
# `spark-submit` on the cluster passes --master k8s://https://<api-server>:6443.
spark.kubernetes.namespace                                   spark-jobs
spark.kubernetes.container.image                             longmystic/spark:3.5.1
spark.kubernetes.authenticate.driver.serviceAccountName      spark
# No external shuffle service exists on K8S: dynamic allocation uses shuffle tracking.
spark.dynamicAllocation.shuffleTracking.enabled              true

# --- MinIO / S3-compatible object storage (replaces HDFS) ------------------
spark.hadoop.fs.s3a.impl              org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint          http://minio.default.svc.cluster.local:9000
spark.hadoop.fs.s3a.path.style.access true
# Credentials come from the `minio-creds` Secret mounted as env vars
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) — do not hardcode keys here.
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider
