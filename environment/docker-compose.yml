# Local Spark standalone cluster for the Spark Mastery learning path.
#
#   1 master + 2 workers  -> a REAL multi-executor Spark UI, so shuffle / skew /
#                            data-locality lessons are observable on your laptop.
#   history server        -> replay finished apps at http://localhost:18080
#   kafka (profile only)  -> only for Days 30-31 streaming: `--profile streaming`
#
# Bring up:   docker compose -f environment/docker-compose.yml up -d
# Streaming:  docker compose -f environment/docker-compose.yml --profile streaming up -d
# Tear down:  docker compose -f environment/docker-compose.yml down
#
# The repo root is mounted at /opt/spark-apps inside every container, so you can:
#   docker compose exec spark-master \
#     /opt/spark/bin/spark-submit --master spark://spark-master:7077 \
#     /opt/spark-apps/exercises/fundamentals/exercise-01-dag-analysis.py

x-spark-image: &spark-image apache/spark:3.5.1

x-spark-common: &spark-common
  image: *spark-image
  volumes:
    - ../:/opt/spark-apps                 # the whole repo (code + exercises)
    - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - spark-events:/opt/spark-events      # shared event log dir for the history server
    - spark-data:/opt/spark-apps/data     # generated parquet tables
  environment:
    - PYTHONPATH=/opt/spark-apps
    - DATA_DIR=/opt/spark-apps/data

services:
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"     # master RPC
      - "8080:8080"     # master web UI
      - "4040:4040"     # driver UI (when you run spark-submit from here)
    environment:
      - SPARK_MASTER_HOST=spark-master
      - PYTHONPATH=/opt/spark-apps
      - DATA_DIR=/opt/spark-apps/data

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    ports:
      - "8081:8081"     # worker 1 web UI
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - PYTHONPATH=/opt/spark-apps
      - DATA_DIR=/opt/spark-apps/data

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    ports:
      - "8082:8081"     # worker 2 web UI
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - PYTHONPATH=/opt/spark-apps
      - DATA_DIR=/opt/spark-apps/data

  spark-history:
    <<: *spark-common
    container_name: spark-history
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    depends_on: [spark-master]
    ports:
      - "18080:18080"   # history server web UI

  # ---- Streaming only (Days 30-31). Start with: --profile streaming ----
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes

volumes:
  spark-events:
  spark-data:
