# Kafka (KRaft, single node) for the Days 30-31 streaming exercises only.
# Apply just for streaming:  kubectl apply -f environment/k8s/06-kafka.yaml
# Reach it from your laptop:  kubectl -n spark-jobs port-forward svc/kafka 9092:9092
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: spark-jobs
  labels: { app: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports:
            - { containerPort: 9092, name: external }
            - { containerPort: 9094, name: internal }
          env:
            - { name: KAFKA_CFG_NODE_ID, value: "0" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.spark-jobs.svc.cluster.local:9092,INTERNAL://kafka.spark-jobs.svc.cluster.local:9094" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT" }
            - { name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME, value: "INTERNAL" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka.spark-jobs.svc.cluster.local:9093" }
            - { name: ALLOW_PLAINTEXT_LISTENER, value: "yes" }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: spark-jobs
spec:
  selector: { app: kafka }
  ports:
    - { name: external, port: 9092, targetPort: 9092 }
    - { name: internal, port: 9094, targetPort: 9094 }
