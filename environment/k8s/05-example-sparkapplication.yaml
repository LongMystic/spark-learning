    """
    Exercise 5: Partitioning Strategies
    Purpose: Understand partitioning and partition pruning
    
    Instructions:
    1. Create partitioned tables
    2. Test partition pruning
    3. Compare partition strategies
    4. Handle small file problems
    """
    
    import os
    import sys
    import tempfile
    import time
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark
    
    from pyspark.sql.functions import col, year, month, dayofmonth
    
    spark = get_spark("Partitioning Strategies Exercise")
    
    # Write demo outputs to a scratch dir so we don't clutter the repo.
    SCRATCH = tempfile.mkdtemp(prefix="ex05_")
    print(f"Scratch output dir: {SCRATCH}")
    
    
    def out(name):
        return os.path.join(SCRATCH, name)
    
    # Exercise 1: Create Partitioned Table
    print("=" * 50)
    print("Exercise 1: Create Partitioned Table")
    print("=" * 50)
    
    # Create data with date columns
    df = spark.range(0, 1000000).withColumn(
        "date", col("id").cast("timestamp")
    ).withColumn("year", year(col("date"))) \
     .withColumn("month", month(col("date"))) \
     .withColumn("day", dayofmonth(col("date"))) \
     .withColumn("amount", (col("id") % 1000) + 1)
    
    # Write partitioned by year and month
    print("Writing partitioned data...")
    df.write.mode("overwrite").partitionBy("year", "month").parquet(out("partitioned_data"))
    
    print("Partitioned data written to: partitioned_data/")
    print("  Structure: year=YYYY/month=MM/data.parquet")
    
    # Exercise 2: Test Partition Pruning
    print("\n" + "=" * 50)
    print("Exercise 2: Partition Pruning")
    print("=" * 50)
    
    # Query with partition filter (should prune)
    print("--- Query with Partition Filter ---")
    start = time.time()
    df_filtered = spark.read.parquet(out("partitioned_data")) \
        .filter((col("year") == 2023) & (col("month") == 1))
    # df_filtered.count()  # Uncomment to execute
    time_pruned = time.time() - start
    
    print(f"  Execution time: {time_pruned:.2f}s")
    print("  Check explain plan for PartitionFilters")
    
    df_filtered.explain(extended=True)
    
    # Query without partition filter (reads all partitions)
    print("\n--- Query without Partition Filter ---")
    start = time.time()
    df_all = spark.read.parquet(out("partitioned_data"))
    # df_all.count()  # Uncomment to execute
    time_all = time.time() - start
    
    print(f"  Execution time: {time_all:.2f}s")
    print("  Reads all partitions")
    
    print(f"\nImprovement: {((time_all - time_pruned) / time_all * 100):.1f}%")
    
    # Exercise 3: Compare Partition Granularity
    print("\n" + "=" * 50)
    print("Exercise 3: Partition Granularity")
    print("=" * 50)
    
    # Strategy 1: Only year
    print("--- Strategy 1: Only Year ---")
    df.write.mode("overwrite").partitionBy("year").parquet(out("strategy1"))
    print("  Partitions: year only")
    
    # Strategy 2: year, month
    print("\n--- Strategy 2: Year, Month ---")
    df.write.mode("overwrite").partitionBy("year", "month").parquet(out("strategy2"))
    print("  Partitions: year, month")
    
    # Strategy 3: year, month, day
    print("\n--- Strategy 3: Year, Month, Day ---")
    df.write.mode("overwrite").partitionBy("year", "month", "day").parquet(out("strategy3"))
    print("  Partitions: year, month, day")
    
    print("""
    Compare:
    - Number of partitions
    - File sizes
    - Query performance
    - Partition pruning effectiveness
    """)
    
    # Exercise 4: Dynamic vs Static Partition Overwrite
    print("\n" + "=" * 50)
    print("Exercise 4: Dynamic Partition Overwrite")
    print("=" * 50)
    
    # Static overwrite (overwrites all partitions)
    print("--- Static Overwrite ---")
    spark.conf.set("spark.sql.sources.partitionOverwriteMode", "static")
    df.write.mode("overwrite").partitionBy("year", "month").parquet(out("partitioned_data"))
    print("  Overwrites all partitions")
    
    # Dynamic overwrite (only overwrites partitions in data)
    print("\n--- Dynamic Overwrite ---")
    spark.conf.set("spark.sql.sources.partitionOverwriteMode", "dynamic")
    df.filter(col("year") == 2023).write.mode("overwrite").partitionBy("year", "month").parquet(out("partitioned_data"))
    print("  Only overwrites partitions present in data")
    
    # Exercise 5: Handle Small Files
    print("\n" + "=" * 50)
    print("Exercise 5: Handle Small Files")
    print("=" * 50)
    
    # Create many small files
    print("Creating many small files...")
    for i in range(10):
        df.filter(col("id") % 10 == i).write.mode("append") \
          .partitionBy("year", "month").parquet(out("small_files"))
    
    print("  Created many small files")
    print("  Check file count and sizes")
    
    # Coalesce to reduce files
    print("\nCoalescing files...")
    df_coalesced = spark.read.parquet(out("small_files")) \
        .repartition(10, "year", "month")
    df_coalesced.write.mode("overwrite") \
        .partitionBy("year", "month").parquet(out("coalesced_files"))
    
    print("  Files coalesced")
    print("  Compare file count: before vs after")
    
    # Exercise 6: Partition Column Selection
    print("\n" + "=" * 50)
    print("Exercise 6: Partition Column Selection")
    print("=" * 50)
    
    print("Good partition columns:")
    print("  - High cardinality (many distinct values)")
    print("  - Frequently used in WHERE clauses")
    print("  - Balanced data distribution")
    print("  - 2-3 columns typically")
    
    print("\nBad partition columns:")
    print("  - Low cardinality (few distinct values)")
    print("  - Very high cardinality (millions of values)")
    print("  - Skewed distribution")
    print("  - Too many columns (5+)")
    
    # Exercise 7: Hive Table Partitioning
    print("\n" + "=" * 50)
    print("Exercise 7: Hive Table Partitioning")
    print("=" * 50)
    
    # Create partitioned managed table (requires a catalog; skipped gracefully on
    # a bare local session without Hive support).
    try:
        print("Creating partitioned managed table...")
        spark.sql("DROP TABLE IF EXISTS partitioned_sales")
        spark.sql("""
            CREATE TABLE IF NOT EXISTS partitioned_sales (
                id BIGINT,
                amount DECIMAL(10,2)
            ) PARTITIONED BY (year INT, month INT)
            USING PARQUET
        """)
        df.select("id", "amount", "year", "month").write.mode("append").insertInto("partitioned_sales")
        print("  Partitioned table created")
    
        # Query with partition pruning
        result = spark.sql("""
            SELECT * FROM partitioned_sales
            WHERE year = 1970 AND month = 1
        """)
        result.explain(extended=True)
        print("  Check explain plan for PartitionFilters")
    except Exception as e:  # noqa: BLE001
        print(f"  (Skipped managed-table demo: {type(e).__name__}: {e})")
        print("  Enable Hive support or run on the cluster to try this section.")
    
    print("\n" + "=" * 50)
    print("Analysis Questions:")
    print("=" * 50)
    print("1. How does partition pruning improve performance?")
    print("2. What is the optimal partition granularity?")
    print("3. What are the trade-offs of dynamic vs static overwrite?")
    print("4. How do you handle small file problems?")
    print("5. What makes a good partition column?")
    print("6. Check explain plans - when does partition pruning occur?")
    
    spark.stop()
    
  exercise-06-join-algorithms.py: |-
    """
    Exercise 6: Join Algorithms
    Purpose: Understand different join strategies and optimization
    
    Instructions:
    1. Compare different join algorithms
    2. Test broadcast joins
    3. Optimize join performance
    4. Handle join skew
    """
    
    import os
    import sys
    import time
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark, read_table
    
    from pyspark.sql.functions import col, broadcast
    
    spark = get_spark("Join Algorithms Exercise")
    
    # Exercise 1: Compare Join Strategies
    print("=" * 50)
    print("Exercise 1: Compare Join Strategies")
    print("=" * 50)
    
    # Create test data
    df_large = spark.range(0, 10000000).withColumn("key", col("id") % 1000)
    df_small = spark.range(0, 1000).withColumn("key", col("id"))
    
    # Sort Merge Join (default for large tables)
    print("--- Sort Merge Join (Default) ---")
    start = time.time()
    result1 = df_large.join(df_small, "key")
    result1.explain()
    # result1.count()  # Uncomment to execute
    time_smj = time.time() - start
    print(f"  Execution time: {time_smj:.2f}s")
    print("  Check explain plan - should show SortMergeJoin")
    
    # Broadcast Hash Join
    print("\n--- Broadcast Hash Join ---")
    start = time.time()
    result2 = df_large.join(broadcast(df_small), "key")
    result2.explain()
    # result2.count()  # Uncomment to execute
    time_bhj = time.time() - start
    print(f"  Execution time: {time_bhj:.2f}s")
    print("  Check explain plan - should show BroadcastHashJoin")
    
    print(f"\nImprovement: {((time_smj - time_bhj) / time_smj * 100):.1f}%")
    print("  Broadcast join avoids shuffle for small table")
    
    # Exercise 2: Broadcast Join Threshold
    print("\n" + "=" * 50)
    print("Exercise 2: Broadcast Join Threshold")
    print("=" * 50)
    
    # Default threshold (10MB)
    print("--- Default Threshold (10MB) ---")
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "10485760")
    result = df_large.join(df_small, "key")
    result.explain()
    print("  Check if small table is broadcasted")
    
    # Increased threshold (50MB)
    print("\n--- Increased Threshold (50MB) ---")
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "52428800")
    result = df_large.join(df_small, "key")
    result.explain()
    print("  Larger tables may be broadcasted")
    
    # Exercise 3: Filter Before Join
    print("\n" + "=" * 50)
    print("Exercise 3: Filter Before Join")
    print("=" * 50)
    
    df1 = read_table(spark, "transactions")
    df2 = read_table(spark, "customers")
    
    # Bad: Join then filter
    print("--- Join Then Filter ---")
    start = time.time()
    result_bad = df1.join(df2, "customer_id").filter(col("status") == "active")
    # result_bad.count()  # Uncomment to execute
    time_bad = time.time() - start
    print(f"  Execution time: {time_bad:.2f}s")
    print("  Shuffles all data, then filters")
    
    # Good: Filter then join
    print("\n--- Filter Then Join ---")
    start = time.time()
    result_good = df1.filter(col("status") == "active").join(
        df2.filter(col("segment") == "enterprise"), "customer_id"
    )
    # result_good.count()  # Uncomment to execute
    time_good = time.time() - start
    print(f"  Execution time: {time_good:.2f}s")
    print("  Filters first, shuffles less data")
    
    print(f"\nImprovement: {((time_bad - time_good) / time_bad * 100):.1f}%")
    
    # Exercise 4: Column Pruning in Joins
    print("\n" + "=" * 50)
    print("Exercise 4: Column Pruning")
    print("=" * 50)
    
    # Bad: Join all columns
    print("--- Join All Columns ---")
    start = time.time()
    result_bad = df1.join(df2, "customer_id")
    # result_bad.count()  # Uncomment to execute
    time_bad = time.time() - start
    print(f"  Execution time: {time_bad:.2f}s")
    
    # Good: Select needed columns first
    print("\n--- Select Needed Columns First ---")
    start = time.time()
    result_good = df1.select("customer_id", "amount", "quantity").join(
        df2.select("customer_id", "segment"), "customer_id"
    )
    # result_good.count()  # Uncomment to execute
    time_good = time.time() - start
    print(f"  Execution time: {time_good:.2f}s")
    print("  Only shuffles needed columns")
    
    print(f"\nImprovement: {((time_bad - time_good) / time_bad * 100):.1f}%")
    
    # Exercise 5: Join Order Optimization
    print("\n" + "=" * 50)
    print("Exercise 5: Join Order")
    print("=" * 50)
    
    # Enable CBO
    spark.conf.set("spark.sql.cbo.enabled", "true")
    spark.conf.set("spark.sql.cbo.joinReorder.enabled", "true")
    
    print("Cost-Based Optimization Enabled:")
    print(f"  CBO Enabled: {spark.conf.get('spark.sql.cbo.enabled')}")
    print(f"  Join Reorder: {spark.conf.get('spark.sql.cbo.joinReorder.enabled')}")
    
    # TODO: Collect statistics first (see Day 28 for CBO + ANALYZE TABLE)
    
    df3 = read_table(spark, "products")
    
    # Multiple joins - Catalyst will optimize order
    result = df1.join(df2, "customer_id").join(df3, "product_id")
    result.explain()
    print("  Catalyst optimizer chooses join order based on statistics")
    
    # Exercise 6: Join Skew Handling
    print("\n" + "=" * 50)
    print("Exercise 6: Join Skew Handling")
    print("=" * 50)
    
    # Enable AQE skew join
    spark.conf.set("spark.sql.adaptive.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    
    print("AQE Skew Join Enabled:")
    print(f"  Skew Join: {spark.conf.get('spark.sql.adaptive.skewJoin.enabled')}")
    
    # Create skewed join scenario
    from pyspark.sql.functions import when, concat, lit
    
    df_skewed1 = spark.range(0, 1000000).withColumn(
        "key",
        when(col("id") < 100000, lit("skewed"))
        .otherwise(concat(lit("normal_"), (col("id") % 100).cast("string")))
    )
    
    df_skewed2 = spark.range(0, 100000).withColumn(
        "key",
        when(col("id") < 10000, lit("skewed"))
        .otherwise(concat(lit("normal_"), (col("id") % 100).cast("string")))
    )
    
    print("\nRunning join with skew...")
    start = time.time()
    result_skewed = df_skewed1.join(df_skewed2, "key")
    # result_skewed.count()  # Uncomment to execute
    time_skewed = time.time() - start
    
    print(f"  Execution time: {time_skewed:.2f}s")
    print("""
    Check Spark UI:
    - Look for skew join indicators
    - Check if partitions were split
    - Compare task execution times
    """)
    
    print("\n" + "=" * 50)
    print("Analysis Questions:")
    print("=" * 50)
    print("1. When should you use broadcast joins?")
    print("2. How does filtering before join improve performance?")
    print("3. What is the impact of column pruning on joins?")
    print("4. How does CBO optimize join order?")
    print("5. How does AQE handle join skew?")
    print("6. Check Spark UI - compare join strategies")
    
    spark.stop()
    
  exercise-07-caching-persistence.py: |-
    """
    Exercise 7: Caching and Persistence
    Purpose: Learn when and how to cache data effectively
    
    Instructions:
    1. Compare caching vs no caching
    2. Test different storage levels
    3. Monitor cache effectiveness
    4. Optimize caching strategy
    """
    
    import os
    import sys
    import time
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark, read_table
    
    from pyspark.sql.functions import col, sum as spark_sum
    from pyspark import StorageLevel
    
    spark = get_spark("Caching and Persistence Exercise")
    
    # Exercise 1: Compare With and Without Cache
    print("=" * 50)
    print("Exercise 1: Compare With and Without Cache")
    print("=" * 50)
    
    # TODO: Replace with your actual table path
    df = read_table(spark, "transactions")
    
    # Without cache
    print("--- Without Cache ---")
    start = time.time()
    result1 = df.filter(col("status") == "active").groupBy("category").agg(spark_sum("amount").alias("total"))
    # result1.count()  # Uncomment to execute
    time1 = time.time() - start
    
    start = time.time()
    result2 = df.filter(col("status") == "active").select("category", "amount").show(10)
    time2 = time.time() - start
    
    total_without_cache = time1 + time2
    print(f"  Query 1 time: {time1:.2f}s")
    print(f"  Query 2 time: {time2:.2f}s")
    print(f"  Total time: {total_without_cache:.2f}s")
    
    # With cache
    print("\n--- With Cache ---")
    df_filtered = df.filter(col("status") == "active")
    df_filtered.cache()
    
    start = time.time()
    result1_cached = df_filtered.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result1_cached.count()  # Uncomment to execute (computes and caches)
    time1_cached = time.time() - start
    
    start = time.time()
    result2_cached = df_filtered.select("category", "amount").show(10)
    time2_cached = time.time() - start
    
    total_with_cache = time1_cached + time2_cached
    print(f"  Query 1 time: {time1_cached:.2f}s (computes and caches)")
    print(f"  Query 2 time: {time2_cached:.2f}s (uses cache)")
    print(f"  Total time: {total_with_cache:.2f}s")
    
    improvement = ((total_without_cache - total_with_cache) / total_without_cache * 100)
    print(f"\nImprovement: {improvement:.1f}%")
    
    # Exercise 2: Compare Storage Levels
    print("\n" + "=" * 50)
    print("Exercise 2: Compare Storage Levels")
    print("=" * 50)
    
    storage_levels = [
        ("MEMORY_ONLY", StorageLevel.MEMORY_ONLY),
        ("MEMORY_AND_DISK", StorageLevel.MEMORY_AND_DISK),
        ("MEMORY_ONLY_SER", StorageLevel.MEMORY_ONLY_SER),
        ("DISK_ONLY", StorageLevel.DISK_ONLY)
    ]
    
    for name, level in storage_levels:
        print(f"\n--- {name} ---")
        df_test = read_table(spark, "transactions")
        df_test.persist(level)
        
        start = time.time()
        df_test.count()  # Trigger persistence
        time_persist = time.time() - start
        
        start = time.time()
        df_test.groupBy("category").agg(spark_sum("amount").alias("total")).count()
        time_query = time.time() - start
        
        print(f"  Persist time: {time_persist:.2f}s")
        print(f"  Query time: {time_query:.2f}s")
        
        df_test.unpersist()
    
    # Exercise 3: Monitor Cache in Spark UI
    print("\n" + "=" * 50)
    print("Exercise 3: Monitor Cache")
    print("=" * 50)
    
    df.cache()
    df.count()  # Trigger caching
    
    print("""
    Check Spark UI - Storage tab:
    - Cached RDDs/DataFrames
    - Memory used for cached data
    - Disk used (if spilled)
    - Size of cached data
    """)
    
    print("\nCheck Spark UI - Executors tab:")
    print("  - Memory usage per executor")
    print("  - Cache hit/miss rates")
    
    # Exercise 4: Cache Eviction
    print("\n" + "=" * 50)
    print("Exercise 4: Cache Eviction")
    print("=" * 50)
    
    # Cache multiple DataFrames
    df1 = read_table(spark, "transactions")
    df2 = read_table(spark, "customers")
    df3 = read_table(spark, "products")
    
    df1.cache()
    df2.cache()
    df3.cache()
    
    df1.count()
    df2.count()
    df3.count()
    
    print("""
    Cached 3 DataFrames
    - If memory is full, older caches may be evicted
    - Check Spark UI to see which DataFrames are cached
    - LRU (Least Recently Used) policy
    """)
    
    # Exercise 5: When NOT to Cache
    print("\n" + "=" * 50)
    print("Exercise 5: When NOT to Cache")
    print("=" * 50)
    
    print("Don't cache if:")
    print("  1. Data used only once")
    print("  2. Data is very large (larger than memory)")
    print("  3. Data changes frequently")
    print("  4. Simple operations (cache overhead > benefit)")
    
    # Example: Simple operation (don't cache)
    print("\nExample: Simple filter (don't cache)")
    df_simple = read_table(spark, "transactions")
    # df_simple.filter(...).cache()  # Bad - filter is fast, cache overhead not worth it
    
    # Example: Expensive operation (do cache)
    print("\nExample: Expensive join (do cache)")
    df_expensive = read_table(spark, "transactions").join(
        read_table(spark, "customers"), "customer_id"
    )
    df_expensive.cache()  # Good - expensive operation, used multiple times
    df_expensive.count()
    
    # Exercise 6: Unpersist
    print("\n" + "=" * 50)
    print("Exercise 6: Unpersist")
    print("=" * 50)
    
    df_cached = read_table(spark, "transactions")
    df_cached.cache()
    df_cached.count()
    
    print("Cached DataFrame")
    print("  Check Spark UI - should show cached data")
    
    df_cached.unpersist()
    
    print("\nUnpersisted DataFrame")
    print("  Check Spark UI - cached data should be removed")
    print("  Memory freed for other operations")
    
    # Exercise 7: Cache Strategy
    print("\n" + "=" * 50)
    print("Exercise 7: Cache Strategy")
    print("=" * 50)
    
    print("Good candidates for caching:")
    print("  1. Iterative algorithms (ML, graph processing)")
    print("  2. Multiple actions on same data")
    print("  3. Small dimension tables")
    print("  4. Intermediate results in complex pipelines")
    
    # Example: Iterative algorithm
    print("\nExample: Iterative computation")
    df_base = read_table(spark, "transactions")
    df_base.cache()
    
    for i in range(5):
        result = df_base.filter(col("store_id") == i).groupBy("category").agg(spark_sum("amount"))
        # result.count()  # Uncomment to execute
        print(f"  Iteration {i}: Uses cached base DataFrame")
    
    df_base.unpersist()
    
    print("\n" + "=" * 50)
    print("Analysis Questions:")
    print("=" * 50)
    print("1. When is caching beneficial?")
    print("2. What storage level is best for your use case?")
    print("3. How do you monitor cache effectiveness?")
    print("4. When should you unpersist?")
    print("5. What are the trade-offs of different storage levels?")
    print("6. Check Spark UI - how is cache being used?")
    
    spark.stop()
    
