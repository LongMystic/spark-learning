apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-code-dag-analysis
  namespace: spark-jobs
data:
  exercise-01-dag-analysis.py: |-
    """
    Exercise 1: DAG Analysis
    Purpose: Understand Spark execution model by analyzing DAGs
    
    Instructions:
    1. Run this script on your Spark cluster
    2. Open Spark UI (http://driver:4040)
    3. Analyze the DAG for each query
    4. Count the number of stages
    5. Identify shuffle operations
    """
    
    import os
    import sys
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark, read_table
    
    from pyspark.sql.functions import col, sum as spark_sum, count
    
    # Initialize Spark Session
    spark = get_spark("DAG Analysis Exercise")
    
    # Exercise 1: Simple transformation (should create 1 stage)
    print("=" * 50)
    print("Exercise 1: Simple Filter and Select")
    print("=" * 50)
    
    df = read_table(spark, "transactions")
    
    result1 = df.filter(col("amount") > 100).select("customer_id", "amount")
    
    # View the execution plan
    print("\nExecution Plan:")
    result1.explain(extended=True)
    
    # Trigger execution and check Spark UI
    print("count:", result1.count())
    
    # Exercise 2: Join operation (should create multiple stages)
    print("\n" + "=" * 50)
    print("Exercise 2: Join Operation")
    print("=" * 50)
    
    df1 = read_table(spark, "transactions")
    df2 = read_table(spark, "customers")
    
    result2 = df1.join(df2, "customer_id").filter(col("status") == "active")
    
    print("\nExecution Plan:")
    result2.explain(extended=True)
    
    # Trigger execution and check Spark UI
    # result2.count()  # Uncomment to execute
    
    # Exercise 3: GroupBy operation (should create multiple stages)
    print("\n" + "=" * 50)
    print("Exercise 3: GroupBy with Aggregation")
    print("=" * 50)
    
    result3 = df.groupBy("category").agg(
        spark_sum("amount").alias("total"),
        count("*").alias("count")
    ).orderBy("total", ascending=False)
    
    print("\nExecution Plan:")
    result3.explain(extended=True)
    
    # Trigger execution and check Spark UI
    result3.show(10)
    
    # Exercise 4: Complex query (multiple stages)
    print("\n" + "=" * 50)
    print("Exercise 4: Complex Multi-Stage Query")
    print("=" * 50)
    
    # TODO: Create a query with at least 3 stages
    # Hint: Use filter, join, and groupBy operations
    
    # Your code here:
    # result4 = ...
    
    # print("\nExecution Plan:")
    # result4.explain(extended=True)
    
    print("\n" + "=" * 50)
    print("Analysis Questions:")
    print("=" * 50)
    print("1. How many stages does each query create?")
    print("2. Which operations cause stage boundaries?")
    print("3. What is the difference between narrow and wide dependencies?")
    print("4. Check Spark UI - what is the task distribution?")
    print("5. What is the data locality for tasks?")
    
    spark.stop()
    
  exercise-02-catalyst-optimizer.py: |-
    """
    Exercise 2: Catalyst Optimizer Analysis
    Purpose: Understand how Catalyst optimizer transforms queries
    
    Instructions:
    1. Run queries with different optimization settings
    2. Compare execution plans
    3. Measure performance differences
    """
    
    import os
    import sys
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark, read_table
    
    from pyspark.sql.functions import col, sum as spark_sum
    
    spark = get_spark("Catalyst Optimizer Exercise")
    
    # Exercise 1: Compare Logical vs Optimized Plans
    print("=" * 50)
    print("Exercise 1: Plan Comparison")
    print("=" * 50)
    
    df = read_table(spark, "transactions")
    df.createOrReplaceTempView("transactions")
    
    # Query with nested structure
    result = df.filter(col("amount") > 25).select("customer_id", "amount", "quantity")
    
    # Note: in PySpark the plans live under result._jdf.queryExecution().*
    print("\n=== Plans (logical -> optimized -> physical) ===")
    result.explain(mode="extended")
    
    # Exercise 2: Predicate Pushdown Analysis
    print("\n" + "=" * 50)
    print("Exercise 2: Predicate Pushdown")
    print("=" * 50)
    
    # Query that should benefit from predicate pushdown
    query = """
    SELECT * FROM (
        SELECT * FROM transactions
    ) WHERE status = 'active' AND amount > 25
    """
    
    result2 = spark.sql(query)
    
    print("\nExecution Plan (check for predicate pushdown):")
    result2.explain(extended=True)
    
    # Exercise 3: Column Pruning
    print("\n" + "=" * 50)
    print("Exercise 3: Column Pruning")
    print("=" * 50)
    
    # Select only needed columns
    result3 = df.select("customer_id", "amount").filter(col("status") == "active")
    
    print("\nExecution Plan (should only read customer_id, amount, status):")
    result3.explain(extended=True)
    
    # Exercise 4: Enable/Disable Optimizations
    print("\n" + "=" * 50)
    print("Exercise 4: Optimization Impact")
    print("=" * 50)
    
    # Disable predicate pushdown
    spark.conf.set("spark.sql.optimizer.predicatePushdown.enabled", "false")
    
    result4 = df.filter(col("amount") > 25)
    print("\nPlan WITHOUT predicate pushdown:")
    result4.explain(extended=True)
    
    # Re-enable
    spark.conf.set("spark.sql.optimizer.predicatePushdown.enabled", "true")
    
    result5 = df.filter(col("amount") > 25)
    print("\nPlan WITH predicate pushdown:")
    result5.explain(extended=True)
    
    # Exercise 5: Cost-Based Optimization
    print("\n" + "=" * 50)
    print("Exercise 5: CBO Analysis")
    print("=" * 50)
    
    # Enable CBO
    spark.conf.set("spark.sql.cbo.enabled", "true")
    spark.conf.set("spark.sql.cbo.joinReorder.enabled", "true")
    
    # TODO: Collect statistics first (works on managed tables; see Day 28)
    # spark.sql("ANALYZE TABLE transactions COMPUTE STATISTICS FOR ALL COLUMNS")
    
    # Join query
    df1 = read_table(spark, "transactions")
    df2 = read_table(spark, "customers")
    
    result6 = df1.join(df2, "customer_id")
    
    print("\nExecution Plan with CBO:")
    result6.explain(extended=True)
    
    print("\n" + "=" * 50)
    print("Analysis Questions:")
    print("=" * 50)
    print("1. What optimizations are applied in the optimized plan?")
    print("2. How does predicate pushdown affect the plan?")
    print("3. What columns are actually read (column pruning)?")
    print("4. How does disabling optimizations affect performance?")
    print("5. What is the impact of CBO on join ordering?")
    
    spark.stop()
    
  exercise-03-memory-management.py: |-
    """
    Exercise 3: Memory Management
    Purpose: Understand Spark memory architecture and optimization
    
    Instructions:
    1. Monitor memory usage in Spark UI
    2. Compare different memory configurations
    3. Analyze garbage collection
    4. Optimize memory settings
    """
    
    import os
    import sys
    import time
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark, read_table
    
    from pyspark.sql.functions import col, sum as spark_sum
    from pyspark import StorageLevel
    
    spark = get_spark("Memory Management Exercise")
    
    # Exercise 1: Monitor Memory Usage
    print("=" * 50)
    print("Exercise 1: Monitor Memory Usage")
    print("=" * 50)
    
    df = read_table(spark, "transactions")
    
    # Cache a DataFrame
    print("Caching DataFrame...")
    df.cache()
    df.count()  # Trigger caching
    
    print("""
    Check Spark UI - Storage tab:
    - Cached RDDs/DataFrames
    - Memory used for cached data
    - Disk used (if spilled)
    - Size of cached data
    """)
    
    print("\nCheck Spark UI - Executors tab:")
    print("  - Memory Used vs Memory Total")
    print("  - Peak Memory Usage")
    print("  - GC Time")
    print("  - GC Count")
    
    # Exercise 2: Compare Memory Configurations
    print("\n" + "=" * 50)
    print("Exercise 2: Compare Memory Configurations")
    print("=" * 50)
    
    # Configuration 1: Default
    print("--- Configuration 1: Default ---")
    spark.conf.set("spark.memory.fraction", "0.6")
    spark.conf.set("spark.memory.storageFraction", "0.5")
    
    start = time.time()
    result1 = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result1.count()  # Uncomment to execute
    time1 = time.time() - start
    print(f"  Execution time: {time1:.2f}s")
    print("  Check for spills in Spark UI")
    
    # Configuration 2: More for execution
    print("\n--- Configuration 2: More for Execution ---")
    spark.conf.set("spark.memory.fraction", "0.8")
    spark.conf.set("spark.memory.storageFraction", "0.2")
    
    start = time.time()
    result2 = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result2.count()  # Uncomment to execute
    time2 = time.time() - start
    print(f"  Execution time: {time2:.2f}s")
    
    # Configuration 3: More for storage
    print("\n--- Configuration 3: More for Storage ---")
    spark.conf.set("spark.memory.fraction", "0.8")
    spark.conf.set("spark.memory.storageFraction", "0.6")
    
    start = time.time()
    result3 = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result3.count()  # Uncomment to execute
    time3 = time.time() - start
    print(f"  Execution time: {time3:.2f}s")
    
    # Exercise 3: Garbage Collection
    print("\n" + "=" * 50)
    print("Exercise 3: Garbage Collection")
    print("=" * 50)
    
    # Enable GC logging
    spark.conf.set("spark.executor.extraJavaOptions",
        "-XX:+UseG1GC "
        "-XX:MaxGCPauseMillis=200 "
        "-XX:G1HeapRegionSize=16m "
        "-XX:InitiatingHeapOccupancyPercent=35 "
        "-XX:+PrintGCDetails "
        "-XX:+PrintGCDateStamps "
        "-Xloggc:/tmp/gc.log")
    
    print("G1GC Configuration:")
    print("  MaxGCPauseMillis: 200ms")
    print("  G1HeapRegionSize: 16m")
    print("  GC Log: /tmp/gc.log")
    
    print("\nRunning memory-intensive query...")
    start = time.time()
    result_gc = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result_gc.count()  # Uncomment to execute
    time_gc = time.time() - start
    
    print(f"  Execution time: {time_gc:.2f}s")
    print("""
    Analyze GC log:
    - Count of GC events
    - Average GC pause time
    - Total GC time
    - GC frequency
    """)
    
    # Exercise 4: Storage Levels
    print("\n" + "=" * 50)
    print("Exercise 4: Compare Storage Levels")
    print("=" * 50)
    
    storage_levels = [
        ("MEMORY_ONLY", StorageLevel.MEMORY_ONLY),
        ("MEMORY_AND_DISK", StorageLevel.MEMORY_AND_DISK),
        ("MEMORY_ONLY_SER", StorageLevel.MEMORY_ONLY_SER),
        ("DISK_ONLY", StorageLevel.DISK_ONLY)
    ]
    
    for name, level in storage_levels:
        print(f"\n--- {name} ---")
        df_test = read_table(spark, "transactions")
        df_test.persist(level)
        
        start = time.time()
        df_test.count()  # Trigger persistence
        time_persist = time.time() - start
        
        start = time.time()
        df_test.groupBy("category").agg(spark_sum("amount").alias("total")).count()
        time_query = time.time() - start
        
        print(f"  Persist time: {time_persist:.2f}s")
        print(f"  Query time: {time_query:.2f}s")
        
        df_test.unpersist()
    
    # Exercise 5: Memory Spill Detection
    print("\n" + "=" * 50)
    print("Exercise 5: Memory Spill Detection")
    print("=" * 50)
    
    print("Running query that may cause spills...")
    start = time.time()
    result_spill = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result_spill.count()  # Uncomment to execute
    time_spill = time.time() - start
    
    print(f"  Execution time: {time_spill:.2f}s")
    print("""
    Check Spark UI - Stages tab:
    - Look for "Spill (Memory)" metrics
    - Look for "Spill (Disk)" metrics
    - High spills indicate memory pressure
    """)
    
    print("\n" + "=" * 50)
    print("Analysis Questions:")
    print("=" * 50)
    print("1. What is the memory usage pattern in Spark UI?")
    print("2. How do memory fractions affect performance?")
    print("3. What is the impact of GC configuration?")
    print("4. Which storage level is best for your use case?")
    print("5. How do spills affect performance?")
    
    spark.stop()
    
  exercise-04-shuffle-mechanics.py: |-
    """
    Exercise 4: Shuffle Mechanics
    Purpose: Understand shuffle operations and optimization
    
    Instructions:
    1. Analyze shuffle in Spark UI
    2. Measure shuffle size and performance
    3. Optimize shuffle partitions
    4. Compare shuffle configurations
    """
    
    import os
    import sys
    import time
    
    sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..")))
    from common.spark_session import get_spark, read_table
    
    from pyspark.sql.functions import col, sum as spark_sum
    
    spark = get_spark("Shuffle Mechanics Exercise")
    
    # Exercise 1: Identify Shuffle Operations
    print("=" * 50)
    print("Exercise 1: Identify Shuffle Operations")
    print("=" * 50)
    
    df = read_table(spark, "transactions")
    
    # Operations that cause shuffle
    print("Operations that cause shuffle:")
    
    # GroupBy (shuffle)
    print("\n1. GroupBy (causes shuffle):")
    result1 = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    result1.explain()
    print("  Check explain plan - should show Exchange (shuffle)")
    
    # Join (shuffle)
    print("\n2. Join (causes shuffle):")
    df2 = read_table(spark, "customers")
    result2 = df.join(df2, "customer_id")
    result2.explain()
    print("  Check explain plan - should show Exchange (shuffle)")
    
    # Filter (no shuffle)
    print("\n3. Filter (no shuffle):")
    result3 = df.filter(col("status") == "active")
    result3.explain()
    print("  Check explain plan - no Exchange (narrow transformation)")
    
    # Exercise 2: Measure Shuffle Size
    print("\n" + "=" * 50)
    print("Exercise 2: Measure Shuffle Size")
    print("=" * 50)
    
    print("Running query with shuffle...")
    start = time.time()
    result = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result.count()  # Uncomment to execute
    time1 = time.time() - start
    
    print(f"  Execution time: {time1:.2f}s")
    print("""
    Check Spark UI - Stages tab:
    - Shuffle Write Size
    - Shuffle Read Size
    - Shuffle Write Time
    - Shuffle Read Time
    - Compare with input data size
    """)
    
    # Exercise 3: Optimize Shuffle Partitions
    print("\n" + "=" * 50)
    print("Exercise 3: Optimize Shuffle Partitions")
    print("=" * 50)
    
    partition_counts = [50, 200, 400, 800]
    results = []
    
    for partitions in partition_counts:
        print(f"\n--- Testing with {partitions} partitions ---")
        spark.conf.set("spark.sql.shuffle.partitions", str(partitions))
        
        start = time.time()
        result = df.groupBy("category").agg(spark_sum("amount").alias("total"))
        # result.count()  # Uncomment to execute
        elapsed = time.time() - start
        
        results.append((partitions, elapsed))
        print(f"  Execution time: {elapsed:.2f}s")
        print(f"  Check Spark UI for task count")
    
    print("\nResults Summary:")
    for partitions, elapsed in results:
        print(f"  {partitions} partitions: {elapsed:.2f}s")
    
    # Exercise 4: Shuffle Compression
    print("\n" + "=" * 50)
    print("Exercise 4: Shuffle Compression")
    print("=" * 50)
    
    # Without compression
    print("--- Without Compression ---")
    spark.conf.set("spark.shuffle.compress", "false")
    start = time.time()
    result = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result.count()  # Uncomment to execute
    time_no_comp = time.time() - start
    print(f"  Execution time: {time_no_comp:.2f}s")
    
    # With compression
    print("\n--- With Compression (lz4) ---")
    spark.conf.set("spark.shuffle.compress", "true")
    spark.conf.set("spark.io.compression.codec", "lz4")
    start = time.time()
    result = df.groupBy("category").agg(spark_sum("amount").alias("total"))
    # result.count()  # Uncomment to execute
    time_comp = time.time() - start
    print(f"  Execution time: {time_comp:.2f}s")
    print("  Check Spark UI for shuffle size difference")
    
    # Exercise 5: Shuffle File Management
    print("\n" + "=" * 50)
    print("Exercise 5: Multiple Local Directories")
    print("=" * 50)
    
    # Configure multiple local directories
    spark.conf.set("spark.local.dir", "/data1/spark,/data2/spark,/data3/spark")
    
    print("Multiple Local Directories Configured:")
