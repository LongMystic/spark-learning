# Example SparkApplication (Spark Operator CRD) — the declarative way to run a job,
# used in the production/orchestration lessons (Days 29, 35-40).
# Apply with:  kubectl apply -f environment/k8s/05-example-sparkapplication.yaml
# Watch with:  kubectl -n spark-jobs get sparkapplication example-dag-analysis -w
#
# This is the K8S analog of `spark-submit --master yarn --deploy-mode cluster app.py`,
# except the job is a Kubernetes object you can version, template, and let Airflow apply.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: example-dag-analysis
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: spark:3.5.1                 # image with your code baked in (or mounted)
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark-apps/exercises/fundamentals/exercise-01-dag-analysis.py
  sparkVersion: "3.5.1"
  restartPolicy: { type: Never }
  # MinIO credentials for s3a:// access
  volumes:
    - name: code-dag-analysis
      configMap:
        name: spark-code-dag-analysis
    - name: code-common
      configMap:
        name: spark-code-common
  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark
    env:
      - name: SPARK_EVENTLOG_DIR
        value: "s3a://spark-events/logs"
    envFrom:
      - secretRef: { name: minio-creds }
    volumeMounts:
      - name: code-dag-analysis
        mountPath: /opt/spark-apps/exercises/fundamentals
      - name: code-common
        mountPath: /opt/spark-apps/common
  executor:
    cores: 2
    instances: 2
    memory: 2g
    env:
      - name: SPARK_EVENTLOG_DIR
        value: "s3a://spark-events/logs"
    envFrom:
      - secretRef: { name: minio-creds }
    volumeMounts:
      - name: code-dag-analysis
        mountPath: /opt/spark-apps/exercises/fundamentals
      - name: code-common
        mountPath: /opt/spark-apps/common
  sparkConf:
    # hadoop-aws + aws-java-sdk-bundle are not in apache/spark:3.5.1 — pull at runtime.
    "spark.jars.packages": "org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262"
    "spark.jars.ivy": "/tmp/.ivy2"
    "spark.hadoop.fs.s3a.endpoint": "http://minio.default.svc.cluster.local:9000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://spark-events/logs"


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-code-common
  namespace: spark-jobs
data:
  spark_session.py: |-
    """
    Shared SparkSession factory for the Spark Mastery learning path.
    
    Every exercise imports from here so the SAME code runs unchanged on your
    Kubernetes cluster (either minikube or on-prem).
    
    Environment variables (all optional):
      DATA_DIR       default "<repo>/data"    where generate_data.py wrote the parquet tables
                                              (on a cluster, an s3a:// path into MinIO/S3)
      ENABLE_ICEBERG "0"/"1", default "0"     adds Iceberg SQL extensions + a local filesystem catalog
      SPARK_EVENTLOG "0"/"1", default "1"     write event logs so the History Server (:18080) can replay runs
    
    Usage inside an exercise:
        from common.spark_session import get_spark, read_table
        spark = get_spark("Day 10 - Data Skew")
        txns  = read_table(spark, "transactions")
    """
    
    import os
    from typing import Optional
    
    
    def repo_root() -> str:
        """Absolute path to the repository root (the folder containing this `common/` package)."""
        return os.path.abspath(os.path.join(os.path.dirname(__file__), ".."))
    
    
    def data_dir() -> str:
        """Directory holding the generated parquet tables. Override with DATA_DIR."""
        return os.environ.get("DATA_DIR", os.path.join(repo_root(), "data"))
    
    
    def table_path(name: str) -> str:
        """Filesystem path of a generated table, e.g. table_path('transactions')."""
        return os.path.join(data_dir(), name)
    
    
    def get_spark(app_name: str = "spark-learning", extra_conf: Optional[dict] = None):
        """
        Build (or reuse) a SparkSession with learning-friendly defaults.
    
        Defaults are intentionally MODEST so behaviour on a laptop mirrors a small
        cluster: AQE on, 8 shuffle partitions, event logging on for the History Server.
        Override any of them via `extra_conf={"spark.sql.shuffle.partitions": "200"}`.
        """
        from pyspark.sql import SparkSession
    
        builder = SparkSession.builder.appName(app_name)
        builder = (
            builder
            # Small, observable defaults. Many lessons deliberately change these.
            .config("spark.sql.adaptive.enabled", "true")
            .config("spark.sql.adaptive.coalescePartitions.enabled", "true")
            .config("spark.sql.shuffle.partitions", "8")
            .config("spark.sql.autoBroadcastJoinThreshold", str(10 * 1024 * 1024))
            # Keep the UI history so you can inspect runs after they finish.
            .config("spark.ui.showConsoleProgress", "true")
        )
    
        if os.environ.get("SPARK_EVENTLOG", "1") == "1":
            events_env = os.environ.get("SPARK_EVENTLOG_DIR")
            if events_env:
                events_uri = events_env if "://" in events_env else _as_uri(events_env)
                builder = builder.config("spark.eventLog.enabled", "true").config("spark.eventLog.dir", events_uri)
    
        if os.environ.get("ENABLE_ICEBERG", "0") == "1":
            warehouse = os.environ.get("ICEBERG_WAREHOUSE", os.path.join(repo_root(), "iceberg-warehouse"))
            os.makedirs(warehouse, exist_ok=True)
            builder = (
                builder.config(
                    "spark.sql.extensions",
                    "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions",
                )
                .config("spark.sql.catalog.local", "org.apache.iceberg.spark.SparkCatalog")
                # "hadoop" here is Iceberg's *filesystem* catalog implementation (it runs over
                # any Hadoop FileSystem, incl. local file:// and s3a://) — NOT the YARN/HDFS
                # stack. On the cluster point the warehouse at s3a://warehouse/iceberg instead.
                .config("spark.sql.catalog.local.type", "hadoop")
                .config("spark.sql.catalog.local.warehouse", "s3a://warehouse")
            )
    
        for key, value in (extra_conf or {}).items():
            builder = builder.config(key, str(value))
    
        spark = builder.getOrCreate()
        spark.sparkContext.setLogLevel(os.environ.get("SPARK_LOG_LEVEL", "WARN"))
        return spark
    
    
    def read_table(spark, name: str):
        """Read a generated parquet table by name (e.g. 'transactions', 'customers')."""
        path = table_path(name)
        if "://" not in path and not os.path.exists(path):
            raise FileNotFoundError(
                f"Table '{name}' not found at {path}.\n"
                f"Generate the sample data first:\n"
                f"    Generate the sample data first using the Kubernetes data generation manifest"
            )
        return spark.read.parquet(path)
    
    
    def _as_uri(path: str) -> str:
        """Turn a local path into a file:// URI (Spark configs want URIs for dirs)."""
        p = os.path.abspath(path).replace("\\", "/")
        if not p.startswith("/"):
            p = "/" + p  # Windows drive paths -> file:///C:/...
        return "file://" + p
  __init__.py: |-

