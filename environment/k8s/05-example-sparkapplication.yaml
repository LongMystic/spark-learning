# Example SparkApplication (Spark Operator CRD) — the declarative way to run a job,
# used in the production/orchestration lessons (Days 29, 35-40).
# Apply with:  kubectl apply -f environment/k8s/05-example-sparkapplication.yaml
# Watch with:  kubectl -n spark-jobs get sparkapplication simple-spark-app -w
#
# This is the K8S analog of `spark-submit --master yarn --deploy-mode cluster app.py`,
# except the job is a Kubernetes object you can version, template, and let Airflow apply.
#
# Code lives in a PersistentVolume (spark-code-pvc), synced via:
#   bash environment/sync-code.sh
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: simple-spark-app
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: longmystic/spark:3.5.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark-apps/exercises/fundamentals/exercise-00-simple-spark-app.py
  sparkVersion: "3.5.1"
  restartPolicy: { type: Never }
  # Code is stored in a PersistentVolume, synced from host via kubectl cp.
  # See environment/sync-code.sh.
  volumes:
    - name: spark-code
      persistentVolumeClaim:
        claimName: spark-code-pvc
  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark
    env:
      - name: SPARK_EVENTLOG_DIR
        value: "s3a://spark-events/logs"
    envFrom:
      - secretRef: { name: minio-creds }
    volumeMounts:
      - name: spark-code
        mountPath: /opt/spark-apps
  executor:
    cores: 1
    instances: 1
    memory: 2g
    env:
      - name: SPARK_EVENTLOG_DIR
        value: "s3a://spark-events/logs"
    envFrom:
      - secretRef: { name: minio-creds }
    volumeMounts:
      - name: spark-code
        mountPath: /opt/spark-apps
  sparkConf:
    # hadoop-aws + aws-java-sdk-bundle are not in apache/spark:3.5.1 — pull at runtime.
    "spark.jars.packages": "org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262"
    "spark.jars.ivy": "/tmp/.ivy2"
    "spark.hadoop.fs.s3a.endpoint": "http://minio.default.svc.cluster.local:9000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://spark-events/logs"
    # Disable S3Guard (Hadoop 3.3.4 bug: PathMetadata "path must be absolute")
    "spark.hadoop.fs.s3a.metadatastore.impl": "org.apache.hadoop.fs.s3a.s3guard.NullMetadataStore"
